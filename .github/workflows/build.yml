name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build from source
        run: ./Build.ps1
      - name: Regression checks
        run: ./Test.ps1
      - name: Package unsigned prerelease
        run: ./Package.ps1
      - name: Build per-user MSI
        run: ./Build-Msi.ps1
      - name: MSI install and uninstall smoke test
        run: ./tests/InstallerChecks.ps1 -Msi ./releases/ResMode-0.2.2-alpha.15-win-x64.msi
      - name: Upload unsigned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ResMode-unsigned-win-x64
          path: |
            releases/*.zip
            releases/*.msi
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: dist/test-results/
          if-no-files-found: ignore

  # A pushed v* tag publishes the MSI and ZIP built above as a prerelease, which is what installed copies look for.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download the built package
        run: gh run download "${{ github.run_id }}" -n ResMode-unsigned-win-x64 -D package
      - name: Publish the prerelease
        run: |
          notes="docs/RELEASE_NOTES_${TAG#v}.md"
          [ -f "$notes" ] || { echo "Missing $notes"; exit 1; }
          gh release create "$TAG" --prerelease --verify-tag --title "ResMode ${TAG#v}" --notes-file "$notes" package/*.msi package/*.zip
